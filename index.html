<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALS Trainer</title>
  <meta name="description" content="Adult Advanced Life Support trainer based on the Resuscitation Council UK 2025 algorithm. One patient at a time, on a real clock.">
  <meta name="theme-color" content="#171e2e">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/app.css">
  <script>
    try {
      var theme = localStorage.getItem("als-theme");
      if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="app"></div>
  <noscript>ALS Trainer needs JavaScript. Nothing is sent to a server.</noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
